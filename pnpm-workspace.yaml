packages:
  - backend
  - frontend
  - contracts
  - circuits
  - scripts
  - packages/*

# Install scripts: true = allowed, false = deliberately skipped (pnpm 12 fails on unlisted ones).
allowBuilds:
  esbuild: true
  # circomlibjs → blake-hash: optional native addon; its pure-JS fallback is used instead.
  blake-hash: false
